<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- 主渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="35%" stop-color="#0f2440"/>
      <stop offset="65%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- 品牌蓝渐变 -->
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677ff"/>
      <stop offset="100%" stop-color="#4096ff"/>
    </linearGradient>

    <!-- 节点发光渐变 -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1677ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1677ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4096ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4096ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4096ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#52c41a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#52c41a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#52c41a" stop-opacity="0"/>
    </radialGradient>

    <!-- 终端扫描线渐变 -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1677ff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#1677ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1677ff" stop-opacity="0.06"/>
      <stop offset="52%" stop-color="#1677ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1677ff" stop-opacity="0"/>
    </linearGradient>

    <!-- 网格图案 -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="60" fill="none"/>
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1677ff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- 小网格图案 -->
    <pattern id="gridSmall" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="20" height="20" fill="none"/>
      <circle cx="10" cy="10" r="0.8" fill="#4096ff" fill-opacity="0.08"/>
    </pattern>

    <!-- 六边形网格 -->
    <pattern id="hexGrid" x="0" y="0" width="80" height="138.56" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 80 23.09 L 80 69.28 L 40 92.38 L 0 69.28 L 0 23.09 Z" fill="none" stroke="#1677ff" stroke-opacity="0.03" stroke-width="1"/>
      <path d="M 40 69.28 L 80 92.38 L 80 138.56 L 40 161.65 L 0 138.56 L 0 92.38 Z" fill="none" stroke="#1677ff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- 滤镜：高斯模糊 -->
    <filter id="blurSm">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blurMd">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurLg">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- ==================== 背景层 ==================== -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 网格叠加 -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gridSmall)"/>
  <rect width="1920" height="1080" fill="url(#hexGrid)"/>

  <!-- ==================== 大光晕 ==================== -->
  <!-- 左上角蓝色光晕 -->
  <ellipse cx="200" cy="180" rx="500" ry="400" fill="url(#glow1)" filter="url(#blurLg)" opacity="0.6"/>
  <!-- 右下角蓝色光晕 -->
  <ellipse cx="1700" cy="900" rx="450" ry="350" fill="url(#glow2)" filter="url(#blurLg)" opacity="0.4"/>
  <!-- 中右绿色小光晕 -->
  <ellipse cx="1550" cy="300" rx="250" ry="200" fill="url(#glow3)" filter="url(#blurLg)" opacity="0.3"/>

  <!-- ==================== 网络节点连接线 ==================== -->
  <g stroke="#1677ff" stroke-opacity="0.12" stroke-width="1" fill="none">
    <!-- 主节点群1 - 左上区域 -->
    <line x1="300" y1="200" x2="500" y2="150"/>
    <line x1="300" y1="200" x2="420" y2="320"/>
    <line x1="500" y1="150" x2="650" y2="220"/>
    <line x1="500" y1="150" x2="580" y2="300"/>
    <line x1="420" y1="320" x2="580" y2="300"/>
    <line x1="650" y1="220" x2="580" y2="300"/>
    <line x1="650" y1="220" x2="780" y2="180"/>
    <line x1="420" y1="320" x2="300" y2="450"/>

    <!-- 主节点群2 - 右侧区域 -->
    <line x1="1400" y1="280" x2="1600" y2="220"/>
    <line x1="1400" y1="280" x2="1500" y2="420"/>
    <line x1="1600" y1="220" x2="1750" y2="300"/>
    <line x1="1500" y1="420" x2="1700" y2="380"/>
    <line x1="1700" y1="380" x2="1750" y2="300"/>
    <line x1="1600" y1="220" x2="1500" y2="150"/>
    <line x1="1750" y1="300" x2="1800" y2="450"/>

    <!-- 跨区域连接 -->
    <line x1="780" y1="180" x2="1100" y2="100" stroke-opacity="0.06"/>
    <line x1="780" y1="180" x2="1400" y2="280" stroke-opacity="0.08"/>
    <line x1="300" y1="450" x2="700" y2="550" stroke-opacity="0.06"/>
    <line x1="1100" y1="100" x2="1500" y2="150" stroke-opacity="0.06"/>

    <!-- 底部连接 -->
    <line x1="300" y1="450" x2="500" y2="600"/>
    <line x1="500" y1="600" x2="700" y2="550"/>
    <line x1="700" y1="550" x2="900" y2="650"/>
    <line x1="500" y1="600" x2="600" y2="750"/>
    <line x1="900" y1="650" x2="1100" y2="580"/>
    <line x1="600" y1="750" x2="800" y2="820"/>
    <line x1="800" y1="820" x2="1000" y2="780"/>
    <line x1="1400" y1="500" x2="1600" y2="580" stroke-opacity="0.08"/>
    <line x1="1600" y1="580" x2="1500" y2="700" stroke-opacity="0.08"/>
    <line x1="1500" y1="700" x2="1700" y2="650" stroke-opacity="0.08"/>
    <line x1="1600" y1="580" x2="1750" y2="720" stroke-opacity="0.08"/>
    <line x1="1800" y1="450" x2="1700" y2="650" stroke-opacity="0.06"/>
  </g>

  <!-- ==================== 网络节点 ==================== -->
  <!-- 普通节点 -->
  <g fill="#1677ff" fill-opacity="0.3">
    <circle cx="300" cy="200" r="3"/>
    <circle cx="500" cy="150" r="2.5"/>
    <circle cx="650" cy="220" r="3"/>
    <circle cx="420" cy="320" r="2"/>
    <circle cx="580" cy="300" r="2"/>
    <circle cx="780" cy="180" r="2.5"/>
    <circle cx="300" cy="450" r="2"/>
    <circle cx="700" cy="550" r="2.5"/>
    <circle cx="500" cy="600" r="3"/>
    <circle cx="900" cy="650" r="2"/>
    <circle cx="1100" cy="580" r="2"/>
    <circle cx="600" cy="750" r="2.5"/>
    <circle cx="800" cy="820" r="2"/>
    <circle cx="1000" cy="780" r="3"/>
    <circle cx="1100" cy="100" r="2"/>
    <circle cx="1500" cy="150" r="2"/>
    <circle cx="1400" cy="280" r="3"/>
    <circle cx="1600" cy="220" r="2.5"/>
    <circle cx="1750" cy="300" r="2"/>
    <circle cx="1500" cy="420" r="2"/>
    <circle cx="1700" cy="380" r="2.5"/>
    <circle cx="1800" cy="450" r="2"/>
    <circle cx="1400" cy="500" r="2"/>
    <circle cx="1600" cy="580" r="2.5"/>
    <circle cx="1500" cy="700" r="2"/>
    <circle cx="1700" cy="650" r="3"/>
    <circle cx="1750" cy="720" r="2"/>
  </g>

  <!-- 发光主节点 -->
  <g>
    <!-- 节点1 - 左上 -->
    <circle cx="300" cy="200" r="12" fill="#1677ff" fill-opacity="0.15"/>
    <circle cx="300" cy="200" r="5" fill="#4096ff" fill-opacity="0.8"/>
    <circle cx="300" cy="200" r="3" fill="#fff" fill-opacity="0.6"/>

    <!-- 节点2 - 中上 -->
    <circle cx="650" cy="220" r="12" fill="#1677ff" fill-opacity="0.15"/>
    <circle cx="650" cy="220" r="5" fill="#4096ff" fill-opacity="0.8"/>
    <circle cx="650" cy="220" r="3" fill="#fff" fill-opacity="0.6"/>

    <!-- 节点3 - 右区域 -->
    <circle cx="1400" cy="280" r="14" fill="#1677ff" fill-opacity="0.15"/>
    <circle cx="1400" cy="280" r="6" fill="#4096ff" fill-opacity="0.8"/>
    <circle cx="1400" cy="280" r="3.5" fill="#fff" fill-opacity="0.6"/>

    <!-- 节点4 - 右下 -->
    <circle cx="1700" cy="650" r="14" fill="#1677ff" fill-opacity="0.15"/>
    <circle cx="1700" cy="650" r="6" fill="#4096ff" fill-opacity="0.8"/>
    <circle cx="1700" cy="650" r="3.5" fill="#fff" fill-opacity="0.6"/>

    <!-- 节点5 - 左下 -->
    <circle cx="500" cy="600" r="13" fill="#1677ff" fill-opacity="0.15"/>
    <circle cx="500" cy="600" r="5.5" fill="#4096ff" fill-opacity="0.8"/>
    <circle cx="500" cy="600" r="3" fill="#fff" fill-opacity="0.6"/>

    <!-- 节点6 - 中右 (绿色节点，表示活动连接) -->
    <circle cx="1600" cy="580" r="13" fill="#52c41a" fill-opacity="0.12"/>
    <circle cx="1600" cy="580" r="5" fill="#52c41a" fill-opacity="0.7"/>
    <circle cx="1600" cy="580" r="2.5" fill="#fff" fill-opacity="0.5"/>
  </g>

  <!-- ==================== 服务器图标 (简化几何形状) ==================== -->
  <g fill="none" stroke="#1677ff" stroke-opacity="0.15" stroke-width="1.5">
    <!-- 左上服务器 -->
    <rect x="760" y="450" width="60" height="14" rx="2"/>
    <rect x="766" y="455" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>
    <rect x="784" y="455" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>

    <rect x="760" y="468" width="60" height="14" rx="2"/>
    <rect x="766" y="473" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>
    <rect x="784" y="473" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>

    <rect x="760" y="486" width="60" height="14" rx="2"/>
    <rect x="766" y="491" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>
    <rect x="784" y="491" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.1"/>
  </g>

  <g fill="none" stroke="#1677ff" stroke-opacity="0.12" stroke-width="1.5">
    <!-- 右下服务器 -->
    <rect x="1150" y="700" width="60" height="14" rx="2"/>
    <rect x="1156" y="705" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>
    <rect x="1174" y="705" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>

    <rect x="1150" y="718" width="60" height="14" rx="2"/>
    <rect x="1156" y="723" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>
    <rect x="1174" y="723" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>

    <rect x="1150" y="736" width="60" height="14" rx="2"/>
    <rect x="1156" y="741" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>
    <rect x="1174" y="741" width="14" height="4" rx="1" fill="#1677ff" fill-opacity="0.08"/>
  </g>

  <!-- ==================== 终端提示符装饰 ==================== -->
  <g font-family="'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="13" fill="#1677ff" fill-opacity="0.06">
    <text x="60" y="850">$ ssh admin@server-01.prod</text>
    <text x="60" y="870">$ ls -la /var/log</text>
    <text x="60" y="890">$ tail -f access.log</text>
    <text x="60" y="910">$ docker ps -a</text>
  </g>

  <g font-family="'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="13" fill="#1677ff" fill-opacity="0.04">
    <text x="1450" y="820">$ systemctl status nginx</text>
    <text x="1450" y="840">$ netstat -tlnp</text>
    <text x="1450" y="860">$ ps aux | grep python</text>
  </g>

  <!-- ==================== 扫描线效果 ==================== -->
  <rect width="1920" height="1080" fill="url(#scanline)" opacity="0.6"/>

  <!-- ==================== 数据流粒子 ==================== -->
  <g fill="#4096ff" fill-opacity="0.25">
    <circle cx="380" cy="180" r="1.2"/>
    <circle cx="450" cy="200" r="1"/>
    <circle cx="550" cy="170" r="1.2"/>
    <circle cx="600" cy="250" r="1"/>
    <circle cx="480" cy="280" r="1"/>
    <circle cx="350" cy="300" r="1.2"/>
    <circle cx="700" cy="200" r="1"/>
    <circle cx="750" cy="190" r="1.2"/>

    <circle cx="1450" cy="250" r="1"/>
    <circle cx="1550" cy="240" r="1.2"/>
    <circle cx="1650" cy="260" r="1"/>
    <circle cx="1700" cy="310" r="1.2"/>
    <circle cx="1480" cy="350" r="1"/>
    <circle cx="1580" cy="380" r="1.2"/>

    <circle cx="400" cy="550" r="1"/>
    <circle cx="550" cy="580" r="1.2"/>
    <circle cx="650" cy="560" r="1"/>
    <circle cx="750" cy="620" r="1"/>
    <circle cx="850" cy="640" r="1.2"/>
    <circle cx="950" cy="600" r="1"/>

    <circle cx="1480" cy="550" r="1"/>
    <circle cx="1550" cy="620" r="1.2"/>
    <circle cx="1650" cy="600" r="1"/>
    <circle cx="1720" cy="680" r="1"/>
  </g>

  <!-- ==================== 角落装饰线 ==================== -->
  <g fill="none" stroke="#1677ff" stroke-opacity="0.12" stroke-width="1">
    <!-- 左上角 -->
    <path d="M 40 120 L 40 40 L 120 40"/>
    <!-- 右上角 -->
    <path d="M 1800 40 L 1880 40 L 1880 120"/>
    <!-- 左下角 -->
    <path d="M 40 960 L 40 1040 L 120 1040"/>
    <!-- 右下角 -->
    <path d="M 1800 1040 L 1880 1040 L 1880 960"/>
  </g>
</svg>
